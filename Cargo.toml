[package]
name = "utopia-validators"
description = "Request parameter validators with their user-facing messages."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/validators"

[dependencies]
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
thiserror = "2"

[package.metadata.utopia]
php-sync = "bf7bd52d83df090e06824cf3c1d0a996f28e5f8b"